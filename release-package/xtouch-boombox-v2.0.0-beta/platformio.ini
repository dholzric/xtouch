; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs  
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder
lib_deps = 
    https://github.com/Bodmer/TFT_eSPI.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@8.3.9
    ArduinoJson@6.21.5
    FS
    SD
    ; Bluetooth and Audio Libraries for Boombox (simplified for initial build)
    https://github.com/pschatzmann/ESP32-A2DP.git
    ; earlephilhower/ESP8266Audio@^1.9.7  ; Temporarily disabled for clean build
    ; https://github.com/schreibfaul1/ESP32-audioI2S.git  ; Temporarily disabled for clean build
    ; https://github.com/kosme/arduinoFFT.git  ; Temporarily disabled for clean build
    ; Web server for Spotify OAuth
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    ; Base64 encoding for Spotify API
    bblanchon/ArduinoJson@^6.21.5
    ; Disabled libraries
    ; https://github.com/knolleary/pubsubclient.git  ; Disabled for minimal build
    ; https://github.com/PaulStoffregen/OneWire.git  ; Disabled for minimal build
    ; milesburton/DallasTemperature@^3.9.0  ; Disabled for minimal build
build_flags =
  -D__XTOUCH_SCREEN_28__
  !python scripts/version.py
extra_scripts = 
    scripts/pre-build.py   
    scripts/post-build.py   

