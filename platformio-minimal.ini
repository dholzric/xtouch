; Minimal PlatformIO Configuration for XTouch Boombox
; ESP32-2432S028R (Cheap Yellow Display) Build

[env:esp32-boombox]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs  
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder

; Minimal core libraries only
lib_deps = 
    https://github.com/Bodmer/TFT_eSPI.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@8.3.9
    ArduinoJson@6.21.5
    FS
    SD
    ; Core audio for boombox
    https://github.com/pschatzmann/ESP32-A2DP.git

build_flags =
    -D__XTOUCH_SCREEN_28__
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    ; Disable features we don't need
    -DDISABLE_ALL_LIBRARY_WARNINGS
    !python scripts/version.py

extra_scripts = 
    scripts/pre-build.py   
    scripts/post-build.py